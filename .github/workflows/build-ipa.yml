name: Build unsigned IPA

# Baut die App auf einem macOS-Runner (Mac in der Cloud) und legt eine
# UNSIGNIERTE .ipa als Download-Artefakt ab. Diese .ipa lädst du herunter und
# installierst sie mit Sideloadly auf dem iPhone (Sideloadly signiert sie dann
# mit deiner Apple-ID). Kein eigener Mac nötig.

on:
  push:
    branches: [dreid]
  workflow_dispatch:      # erlaubt manuellen Start per Knopfdruck auf GitHub

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Neuestes verfügbares Xcode wählen (muss zum Projektformat von XcodeGen passen)
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core tests
        run: swift test

      - name: Build archive (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project LastScan.xcodeproj \
            -scheme LastScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LastScan.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -eo pipefail
          echo "Archiv-Inhalt:"
          ls -R build/LastScan.xcarchive/Products || { echo "Kein Products-Ordner – Archive-Schritt hat nichts gebaut."; exit 1; }
          APP=$(find build/LastScan.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "Keine .app gefunden."; exit 1; fi
          echo "Gefundene App: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qr LastScan.ipa Payload && rm -rf Payload )
          ls -lh out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastScan3D-unsigned-ipa
          path: out/LastScan.ipa
          if-no-files-found: error
