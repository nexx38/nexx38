name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Diagnose auf VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 6m
          script: |
            echo "##### LIVE-TEST mit korrekten Parametern (von/bis) — PII-frei #####"
            for range in "von=2026-06-01&bis=2026-06-30" "von=2026-06-01&bis=2026-12-31" "von=2026-01-01&bis=2026-12-31"; do
              curl -s --max-time 40 "http://localhost:3000/api/kalender/icloud-events?$range" > /tmp/v.json 2>&1
              echo "--- Range: $range  (Bytes: $(wc -c < /tmp/v.json)) ---"
              python3 -c "import json;d=json.load(open('/tmp/v.json'));print('  Anzahl=',len(d) if isinstance(d,list) else 'KEIN-ARRAY');print('  Felder=',list(d[0].keys()) if isinstance(d,list) and len(d)>0 else 'leer')" 2>&1
              python3 -c "import json,sys;d=json.load(open('/tmp/v.json'));sys.exit(0 if isinstance(d,list) else 1)" 2>/dev/null || { echo '  RAW-Fehlerantwort (kein PII):'; head -c 300 /tmp/v.json; echo ''; }
            done
            echo "##### FERTIG #####"
