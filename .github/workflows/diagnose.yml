name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verifikation Planer iCloud-Termine (read-only, PII-frei)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 6m
          script: |
            echo "##### A. Planer-Container Status #####"
            docker ps --filter name=shk-planer-api --format '{{.Names}} {{.Status}}'

            echo ""
            echo "##### B. /api/termine je Tag (2026-06-14 .. 2026-07-13): Anzahl + Quelle (KEINE PII) #####"
            total_ic=0; total_lo=0
            for off in $(seq 0 29); do
              d=$(date -u -d "2026-06-14 +$off day" +%Y-%m-%d)
              curl -s --max-time 25 "http://localhost:3002/api/termine?date=$d" > /tmp/t.json 2>&1
              line=$(python3 -c "import json;d=json.load(open('/tmp/t.json'));ic=sum(1 for x in d if isinstance(x,dict) and x.get('quelle')=='icloud') if isinstance(d,list) else -1;lo=sum(1 for x in d if isinstance(x,dict) and x.get('quelle')=='lokal') if isinstance(d,list) else -1;print(ic,lo)" 2>/dev/null || echo "ERR ERR")
              ic=$(echo $line | cut -d' ' -f1); lo=$(echo $line | cut -d' ' -f2)
              if [ "$ic" != "0" ] || [ "$lo" != "0" ]; then echo "  $d -> iCloud:$ic  lokal:$lo"; fi
              case "$ic" in ''|*[!0-9]*) ;; *) total_ic=$((total_ic+ic));; esac
              case "$lo" in ''|*[!0-9]*) ;; *) total_lo=$((total_lo+lo));; esac
            done
            echo "  >>> SUMME 30 Tage: iCloud=$total_ic  lokal=$total_lo"

            echo ""
            echo "##### C. Planer-Logs: iCloud-/DB-Fehler? #####"
            docker logs shk-planer-api --tail 60 2>&1 | grep -iE 'icloud|fehler|error|caldav' | head -20 || echo "(keine relevanten Logzeilen)"

            echo ""
            echo "##### FERTIG #####"
