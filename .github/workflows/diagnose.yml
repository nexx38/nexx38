name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Diagnose auf VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            SECRET_FILTER='passwo|password|passwort|secret|token|api[_-]?key|app[_-]?specific|app[_-]?passwort|credential|bearer|authorization|privatekey|private_key|apple_id|smtp'

            echo "##### 1. OOM / RESTART-FAKTEN #####"
            docker inspect shk-backend --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} Status={{.State.Status}} MemLimit={{.HostConfig.Memory}} StartedAt={{.State.StartedAt}}' 2>&1
            free -h | head -2

            echo ""
            echo "##### 2. HATTE termine im Export Daten? (Zeilen direkt nach COPY-Header) #####"
            sed -n '3461577,3461590p' /opt/shk-app/shkdb_export.sql 2>/dev/null | cut -c1-90

            echo ""
            echo "##### 3. SYNC-PLANER (node-cron / schedule / setInterval) in server.js #####"
            grep -nE 'cron\.|schedule\(|setInterval|nodeCron|node-cron' /opt/shk-app/backend/server.js 2>/dev/null | sed -E "/($SECRET_FILTER)/Id" | head -15

            echo ""
            echo "##### 4. KALENDER/CALDAV/ICLOUD/TERMINE-Zeilen in server.js #####"
            grep -niE 'caldav|icloud|kalender|tsdav|vevent|fetchcalendar|syncKalender|syncTermine|dav\.' /opt/shk-app/backend/server.js 2>/dev/null | sed -E "/($SECRET_FILTER)/Id" | head -40

            echo ""
            echo "##### 5. ROUTEN mit termine/kalender/sync #####"
            grep -nE "app\.(get|post|put|delete)\([^)]*(termin|kalender|sync|calendar)" /opt/shk-app/backend/server.js 2>/dev/null | sed -E "/($SECRET_FILTER)/Id" | head -25

            echo ""
            echo "##### FERTIG #####"
