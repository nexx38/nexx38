name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Diagnose auf VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "##### 1. DOCKER CONTAINER #####"
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "##### 2. DATENBANKEN in shk-db #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "\l" 2>&1 | head -30

            echo ""
            echo "##### 3. ALLE TABELLEN in shkdb #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "\dt" 2>&1

            echo ""
            echo "##### 4. SCHEMA der termine-Tabelle #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "\d termine" 2>&1

            echo ""
            echo "##### 5. ANZAHL + ZEITRAUM der termine #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "SELECT COUNT(*) AS anzahl, MIN(datum) AS aeltester, MAX(datum) AS neuester FROM termine;" 2>&1

            echo ""
            echo "##### 6. LETZTE 15 TERMINE #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "SELECT id, datum, zeit_von, zeit_bis, titel, typ FROM termine ORDER BY datum DESC NULLS LAST LIMIT 15;" 2>&1

            echo ""
            echo "##### 7. TABELLEN mit Kalender/Apple/Event/Sync Bezug #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND (table_name ILIKE '%calendar%' OR table_name ILIKE '%kalender%' OR table_name ILIKE '%apple%' OR table_name ILIKE '%event%' OR table_name ILIKE '%sync%' OR table_name ILIKE '%ical%');" 2>&1

            echo ""
            echo "##### 8. .md DOKU-DATEIEN auf dem Server #####"
            find /root /opt /var/www /home /srv -maxdepth 6 -iname '*.md' -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | head -60

            echo ""
            echo "##### 9. Verzeichnisse mit 'shk' im Namen #####"
            find / -maxdepth 4 -type d -iname '*shk*' 2>/dev/null | head -40

            echo ""
            echo "##### 10. n8n WORKFLOWS (Apple-Kalender-Sync?) #####"
            find /root /home -maxdepth 6 -path '*n8n*' -iname '*.json' 2>/dev/null | head -20
            docker ps -a --format '{{.Names}}' | grep -i n8n || echo "(kein n8n-Container – läuft als Host-Prozess)"

            echo ""
            echo "##### FERTIG #####"
