name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Diagnose auf VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            # Helfer: filtert Zeilen mit möglichen Geheimnissen heraus (Repo ist öffentlich!)
            SECRET_FILTER='passwo|password|passwort|secret|token|api[_-]?key|app[_-]?specific|credential|bearer|authorization|privatekey|private_key'

            echo "##### A. VERFAHRENSDOKUMENTATION (gefiltert) #####"
            sed -E "/($SECRET_FILTER)/Id" /opt/shk-app/backups/tooltime_archiv/Verfahrensdokumentation_ENTWURF.md 2>&1 | head -120

            echo ""
            echo "##### B. STRUKTUR /opt/shk-app #####"
            ls -la /opt/shk-app 2>&1 | head -40
            echo "--- weitere .md / README im SHK-App ---"
            find /opt/shk-app -maxdepth 4 -iname '*.md' -o -maxdepth 4 -iname 'README*' 2>/dev/null | grep -v node_modules | head -30

            echo ""
            echo "##### C. kalender_einstellungen – Schema + Zeilenzahl (KEINE Werte) #####"
            docker exec -i shk-db psql -U shk -d shkdb -c "\d kalender_einstellungen" 2>&1
            docker exec -i shk-db psql -U shk -d shkdb -c "SELECT COUNT(*) AS anzahl FROM kalender_einstellungen;" 2>&1
            echo "--- nicht-geheime Spalten (Schema-Übersicht) ---"
            docker exec -i shk-db psql -U shk -d shkdb -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='kalender_einstellungen' ORDER BY ordinal_position;" 2>&1

            echo ""
            echo "##### D. shk-backend Logs – Kalender/iCloud/Termin/Fehler (gefiltert) #####"
            docker logs shk-backend --tail 300 2>&1 | grep -iE 'kalender|calendar|icloud|caldav|termin|sync|error|fehler' | sed -E "/($SECRET_FILTER)/Id" | tail -40

            echo ""
            echo "##### E. n8n-Workflow – nur Node-Namen/Typen (keine Werte) #####"
            grep -oE '"name":[^,]*|"type":[^,]*' /root/n8n_kedicik_workflow.json 2>/dev/null | sed -E "/($SECRET_FILTER)/Id" | head -60

            echo ""
            echo "##### F. SHK-Backend Quellcode – Kalender-/Termin-Dateien #####"
            find /opt/shk-app -maxdepth 5 -type f \( -iname '*kalender*' -o -iname '*calendar*' -o -iname '*termin*' -o -iname '*caldav*' -o -iname '*icloud*' \) 2>/dev/null | grep -v node_modules | head -30

            echo ""
            echo "##### FERTIG #####"
