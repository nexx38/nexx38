name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: iCloud Schreib-/Loesch-Roundtrip testen (selbst-aufraeumend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            BASE="http://localhost:3002"
            D="2026-12-31"

            echo "##### 1. Test-Termin anlegen (POST) #####"
            curl -s -X POST "$BASE/api/termine" -H 'Content-Type: application/json' \
              -d '{"titel":"ZZ Planer-Test bitte ignorieren","datum":"2026-12-31","zeit_von":"09:00","zeit_bis":"10:00","notizen":"automatischer Test"}' > /tmp/post.json
            cat /tmp/post.json; echo ""
            uid=$(python3 -c "import json;print(json.load(open('/tmp/post.json')).get('icloud_uid',''))" 2>/dev/null)
            echo "UID=$uid"

            echo ""
            echo "##### 2. Erscheint der Termin am $D? #####"
            curl -s "$BASE/api/termine?date=$D" > /tmp/g1.json
            python3 -c "import json;d=json.load(open('/tmp/g1.json'));print('Anzahl am Tag=',len(d));print('Test-UID vorhanden=', any(x.get('icloud_uid')=='$uid' for x in d))" 2>&1

            echo ""
            echo "##### 3. Test-Termin wieder loeschen (DELETE) #####"
            curl -s -X DELETE "$BASE/api/termine/$uid"; echo ""

            echo ""
            echo "##### 4. Ist er weg? #####"
            curl -s "$BASE/api/termine?date=$D" > /tmp/g2.json
            python3 -c "import json;d=json.load(open('/tmp/g2.json'));print('Anzahl am Tag=',len(d));print('Test-UID noch da=', any(x.get('icloud_uid')=='$uid' for x in d))" 2>&1

            echo ""
            echo "##### FERTIG #####"
