name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Diagnose auf VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            SECRET_FILTER='passwo|password|passwort|secret|token|api[_-]?key|app[_-]?specific|app[_-]?passwort|credential|bearer|authorization|privatekey|private_key|apple_id|smtp|mail_pass'

            echo "##### A. BACKEND-GESUNDHEIT (Absturz/OOM?) #####"
            docker inspect shk-backend --format 'Status={{.State.Status}} Running={{.State.Running}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} MemLimit={{.HostConfig.Memory}}' 2>&1
            echo "--- Host-RAM ---"
            free -h 2>&1
            echo "--- docker stats (einmalig) ---"
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' 2>&1

            echo ""
            echo "##### B. BACKEND-LOGS (letzte 40 Zeilen, ungefiltert nach Keyword) #####"
            docker logs shk-backend --tail 40 2>&1 | sed -E "/($SECRET_FILTER)/Id"

            echo ""
            echo "##### C. BACKEND-STRUKTUR #####"
            ls -la /opt/shk-app/backend 2>&1 | head -40
            echo "--- alle .js Dateien (ohne node_modules) ---"
            find /opt/shk-app/backend -name '*.js' -not -path '*/node_modules/*' 2>/dev/null | head -60

            echo ""
            echo "##### D. KALENDER/CALDAV/ICLOUD/TERMINE im Backend-Code #####"
            grep -rilE 'caldav|icloud|kalender|tsdav|termine|dav-' /opt/shk-app/backend --include='*.js' 2>/dev/null | grep -v node_modules | head -30
            echo "--- CalDAV-Bibliotheken in package.json ---"
            grep -iE 'dav|ical|calendar|caldav|cron' /opt/shk-app/backend/package.json 2>&1 | sed -E "/($SECRET_FILTER)/Id"

            echo ""
            echo "##### E. SYNC-MECHANIK: Endpunkt / Cron / Zeitplan #####"
            grep -rnE 'sync|cron|schedule|setInterval' /opt/shk-app/backend --include='*.js' 2>/dev/null | grep -iE 'kalender|termin|caldav|icloud|sync' | grep -v node_modules | sed -E "/($SECRET_FILTER)/Id" | head -25
            echo "--- system-cron / timer ---"
            crontab -l 2>/dev/null | sed -E "/($SECRET_FILTER)/Id" | head -20 || echo "(kein crontab)"

            echo ""
            echo "##### F. WAREN TERMINE JE IN DER DB? (Export vom 05.05.) #####"
            echo "Suche COPY/INSERT-Block für termine im 725MB-Dump…"
            grep -m1 -n 'COPY public.termine\|INSERT INTO termine\|INSERT INTO public.termine' /opt/shk-app/shkdb_export.sql 2>/dev/null || echo "(kein termine-Datenblock im Export gefunden)"

            echo ""
            echo "##### FERTIG #####"
