name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [claude/shk-tagesplaner-pwa-GWi78]
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Latenz + nginx-Pfad prüfen (PII-frei)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.159.191
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "##### A. Antwortzeit /api/termine (Backend direkt, 3 Messungen) #####"
            for i in 1 2 3; do
              t=$(curl -s -o /tmp/t.json -w '%{time_total}' --max-time 40 "http://localhost:3002/api/termine?date=2026-06-15")
              n=$(python3 -c "import json;d=json.load(open('/tmp/t.json'));print(len(d) if isinstance(d,list) else 'ERR')" 2>/dev/null || echo ERR)
              echo "  Messung $i: ${t}s  Anzahl=$n"
            done

            echo ""
            echo "##### B. Öffentlicher Weg über nginx (Host-Header) #####"
            code=$(curl -s -o /tmp/n.json -w '%{http_code}' --max-time 40 -H 'Host: planer.shk-innovation.de' "http://127.0.0.1/api/termine?date=2026-06-15")
            echo "  HTTP-Code via nginx: $code"
            python3 -c "import json;d=json.load(open('/tmp/n.json'));print('  Anzahl via nginx=',len(d) if isinstance(d,list) else 'KEIN-ARRAY')" 2>&1

            echo ""
            echo "##### C. Ausgelieferte index.html / SW-Referenz (Cache-Hinweis) #####"
            curl -s --max-time 20 -H 'Host: planer.shk-innovation.de' "http://127.0.0.1/" | grep -iE 'registerSW|sw\.js|workbox' | head -5 || echo "(kein SW-Verweis gefunden)"

            echo ""
            echo "##### FERTIG #####"
