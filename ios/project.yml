# XcodeGen project definition — generates HeizlastScan.xcodeproj in CI.
# Build: `xcodegen generate` then `xcodebuild ... CODE_SIGNING_ALLOWED=NO`.
name: HeizlastScan
options:
  bundleIdPrefix: de.nexx38
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PRODUCT_BUNDLE_IDENTIFIER: de.nexx38.heizlastscan
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    GENERATE_INFOPLIST_FILE: NO

targets:
  HeizlastScan:
    type: application
    platform: iOS
    sources:
      - HeizlastScan
    # XcodeGen regenerates the Info.plist at this path from `properties`
    # below. All custom keys MUST live here — a bare `info.path` would emit
    # only the default bundle keys and drop NSCameraUsageDescription, which
    # crashes the app the moment it touches the camera/LiDAR (TCC violation).
    info:
      path: HeizlastScan/Info.plist
      properties:
        CFBundleDisplayName: HeizlastScan
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSCameraUsageDescription: "Die Kamera und der LiDAR-Sensor werden zum Vermessen des Raumes verwendet."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
