# XcodeGen project definition — generates HeizlastScan.xcodeproj in CI.
# Build: `xcodegen generate` then `xcodebuild ... CODE_SIGNING_ALLOWED=NO`.
name: HeizlastScan
options:
  bundleIdPrefix: de.nexx38
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PRODUCT_BUNDLE_IDENTIFIER: de.nexx38.heizlastscan
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: HeizlastScan/Info.plist

targets:
  HeizlastScan:
    type: application
    platform: iOS
    sources:
      - HeizlastScan
    info:
      path: HeizlastScan/Info.plist
