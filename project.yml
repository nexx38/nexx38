name: LastScan
options:
  bundleIdPrefix: de.shk-innovation
  deploymentTarget:
    iOS: "17.0"
packages:
  KuehllastCore:
    path: .
targets:
  LastScan:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: KuehllastCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LastScan 3D
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Für den 3D-Scan eines Raums wird die Kamera benötigt.
        UIRequiredDeviceCapabilities:
          - arkit
    settings:
      base:
        # Eigene Bundle-ID: die Test-App laeuft NEBEN der stabilen LastScan,
        # damit Optik-Experimente das Arbeitsgeraet nie gefaehrden.
        PRODUCT_BUNDLE_IDENTIFIER: de.shk-innovation.LastScan3D
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LastScan:
    build:
      targets:
        LastScan: all
    run:
      config: Debug
    archive:
      config: Release
